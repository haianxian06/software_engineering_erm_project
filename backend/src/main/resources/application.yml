server:
  port: 8080

spring:
  application:
    name: homework-system
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/homework_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 220MB
  sql:
    init:
      mode: never

app:
  upload-dir: D:/ruanjiangongcheng/homework-system/uploads
  archive-dir: D:/ruanjiangongcheng/homework-system/archives
  package-dir: D:/ruanjiangongcheng/homework-system/packages
  package-link-ttl-minutes: 30
